name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, QA and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gate
        run: npm run check

      - name: Automated QA gate
        run: npm run qa

      - name: Browser QA gate
        env:
          QA_EVIDENCE_LABEL: preview
        run: npm run qa:browser

      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-qa-${{ github.run_id }}
          path: qa-artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Exported React project smoke
        run: WEBBLUEPRINT_EXPORT_SMOKE=1 npm run test:run -- src/export/export.integration.test.ts

      - name: Verify deployable SPA fallback
        run: test -f dist/.htaccess

      - name: Upload PR build preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload tested production bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-production
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
